<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
        }

        /* Poster */
        .poster {
            width: 100%;
            max-width: 350px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        .poster:hover {
            transform: scale(1.03);
        }

        .click-text {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            opacity: 0.8;
        }

        /* Video */
        .video-box {
            display: none;
            width: 100%;
        }

        video {
            width: 100%;
            max-height: 80vh;
            background: #000;
            border-radius: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #222;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #444;
        }

        .back-btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Poster -->
        <img src="Lovely Runner.jpg" class="poster" onclick="playVideo()" alt="Lovely Runner">

            <div class="click-text">
                ▶ Click poster to watch
            </div>
        </div>

        <!-- Video Player -->
        <div class="video-box" id="videoBox">

            <video id="videoPlayer" controls playsinline>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>

            <div class="back-btn" onclick="closeVideo()">
                ← Back
            </div>

        </div>

    </div>

    <script>
        function playVideo() {
            document.getElementById("posterBox").style.display = "none";
            document.getElementById("videoBox").style.display = "block";

            const video = document.getElementById("videoPlayer");

            video.currentTime = 0;
            video.play();
        }

        function closeVideo() {
            const video = document.getElementById("videoPlayer");

            video.pause();
            video.currentTime = 0;

            document.getElementById("videoBox").style.display = "none";
            document.getElementById("posterBox").style.display = "block";
        }
    </script>

</body>
</html>
